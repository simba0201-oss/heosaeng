<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>허생전 통합 학습 뷰어</title>
    <style>
        :root {
            --primary: #1e40af;
            --bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
            --hl-bg: #fef08a;
            --hl-hover: #fde047;
            --panel-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-size: 22px; 
            line-height: 1.8;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { margin: 0; font-size: 1.5rem; }

        .search-area { display: flex; gap: 10px; align-items: center; }

        #searchInput {
            padding: 10px;
            font-size: 1.1rem;
            border: none;
            border-radius: 4px;
            width: 300px;
        }

        #showAllBtn {
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex: 1;
            width: 100%;
            overflow: hidden;
        }

        /* 본문 영역: 부드러운 스크롤 추가 */
        .text-panel {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            word-break: keep-all;
            scroll-behavior: smooth; 
        }

        .dict-panel {
            flex: 1;
            background: #f8fafc;
            border-left: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* 탭 UI 스타일 */
        .tab-container {
            display: flex;
            background: #e2e8f0;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            background: transparent;
            color: #64748b;
            transition: 0.2s;
        }

        .tab-btn:hover { background: #cbd5e1; }
        
        .tab-btn.active {
            background: var(--panel-bg);
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .dict-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            background: var(--panel-bg);
        }

        /* 사전 및 Q&A 아이템 */
        .dict-item {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .dict-word { 
            font-weight: bold; font-size: 1.4rem; color: var(--primary); 
            margin-bottom: 8px; transition: 0.2s; 
        }
        /* ✨ 사전에서 단어 클릭 효과 */
        .dict-word.clickable { cursor: pointer; display: inline-block; }
        .dict-word.clickable:hover { color: #dc2626; text-decoration: underline; }

        .qa-q { font-weight: bold; font-size: 1.3rem; color: #0f172a; margin-bottom: 8px; border-left: 4px solid var(--primary); padding-left: 10px; }
        .qa-a { font-size: 1.1rem; color: #334155; padding-left: 14px; }

        /* 퀴즈 공통 UI */
        .quiz-container { display: flex; flex-direction: column; gap: 15px; height: 100%; }
        .quiz-timer { font-size: 1.2rem; font-weight: bold; color: #0f172a; }
        .quiz-score { font-size: 1.2rem; font-weight: bold; color: #475569; }
        .quiz-reset-btn {
            padding: 6px 12px; font-size: 1rem; border: none; border-radius: 4px;
            background: #e2e8f0; color: #0f172a; cursor: pointer; font-weight: bold; margin-left: 10px; transition: 0.2s;
        }
        .quiz-reset-btn:hover { background: #cbd5e1; }
        
        /* 어휘 퀴즈 전용 */
        .quiz-question { font-size: 1.3rem; font-weight: bold; background: #f1f5f9; padding: 20px; border-radius: 8px; line-height: 1.6; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .quiz-btn { 
            padding: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            background: #ffffff; border: 2px solid var(--border); border-radius: 8px;
            color: var(--primary); transition: 0.2s;
        }
        .quiz-btn:hover:not(:disabled) { background: #e0e7ff; border-color: var(--primary); }
        .quiz-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .quiz-feedback { margin-top: 10px; }

        /* 요점 퀴즈 전용 (빈칸 채우기) */
        .qa-input {
            border: 0;
            border-bottom: 2px dashed var(--primary);
            background: #f1f5f9;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            outline: none;
            padding: 2px 5px;
            margin: 0 4px;
            transition: 0.2s;
        }
        .qa-input:focus { border-bottom: 2px solid #dc2626; background: #fff; }
        .qa-highlight { font-weight: bold; color: var(--primary); }
        .qa-correction { color: #dc2626; font-weight: bold; margin-left: 4px; font-size: 0.95rem; }

        /* 본문 하이라이트 */
        .vocab-hl {
            background-color: var(--hl-bg);
            cursor: pointer;
            border-radius: 4px;
            padding: 2px 4px;
            font-weight: 600;
            transition: 0.2s;
        }
        .vocab-hl:hover, .vocab-hl.active { background-color: var(--hl-hover); border-bottom: 2px solid #dc2626; }

        @media print {
            @page { size: A4; margin: 0; }
            body { font-size: 14pt; line-height: 1.5; }
            header, .dict-panel { display: none; }
            .container { display: block; overflow: visible; }
            .text-panel { flex: none; width: 100%; padding: 15px; overflow: visible; }
            .vocab-hl { background-color: transparent; text-decoration: underline; }
        }
    </style>
</head>
<body>

    <h1>허생전 통합 학습 뷰어</h1>

    const rawText = `허생은 남산 아래 묵적골에 살았다. 남산 밑 골짜기로 곧장 가면 우물 위쪽에 해묵은 은행나무가 한 그루 서 있고, 사립문 하나가 그 은행나무 쪽으로 늘 열려 있다. 집이라고 해 봐야 비바람에 다 쓰러져 가는 초가집, 그 집이 바로 허생의 집이었다.
허생은 집에 비가 새고 바람이 드는 것도 아랑곳하지 않고 글 읽기만 좋아하였다. 그래서 아내가 삯바느질을 해서 그날그날 겨우 입에 풀칠을 하는 처지였다.

그러나 허생은 아무렇지도 않게 껄껄 웃으며 말하였다.

허생은 그 길로 문밖으로 나섰다. 그러나 서울 장안에 아는 사람이라고는 한 사람도 없었다. 허생은 곧장 종로 네거리로 가서 아무나 길 가는 사람을 붙들고 물었다.

때마침 그 사람이 변씨 성을 가진 부자를 일러 주었다. 허생은 그 길로 변 부자를 찾아가 예를 갖춘 뒤에 한마디로 잘라 말하였다.
“내가 집이 가난해서 뭘 좀 해 보고 싶은데 밑천이 없구려. 돈 만 냥만 빌려 주시오.”

허생은 변 부자에게 만 냥을 얻어 가지고 집에는 들르지도 않고 곧장 안성으로 내려갔다.

얼마 안 가서 나라 안의 과일이란 과일은 모두 동이 나 버렸다. 잔치나 제사를 지내려고 해도 과일이 없으니 상을 제대로 차릴 수가 없었다. 이렇게 되니, 과일 장수들은 너나없이 허생한테 몰려와서 제발 과일 좀 팔라고 통사정을 하였다. 결국 허생은 처음 값의 열 배를 받고 과일을 되팔았다.
“허허, 겨우 만 냥으로 나라의 경제를 흔들어 놓았으니, 이 나라 형편이 어떤지 알 만하구나.”
허생은 이렇게 탄식하고는 또 칼, 호미, 실이며 베, 솜 따위를 모조리 사들여 제주도로 건너갔다. 그리고 그것을 팔아 말총이란 말총은 모두 거두어들였다. 말총은 갓과 망건을 만드는 재료였다.

과연 얼마 가지 않아 나라의 갓값과 망건값이 열 배로 훌쩍 뛰었다. 그렇게 해서 허생은 엄청난 돈을 긁어모으게 되었다.
     
어느 날 허생은 바닷가로 나가 늙은 뱃사공을 붙잡고 은근히 물었다.

뱃사공은 흔쾌히 허생의 말을 따랐다.
허생은 바람을 타고 줄곧 배를 몰아 마침내 그 섬에 이르렀다. 허생은 섬에서 가장 높은 곳으로 올라가 사방을 둘러보고는 썩 마음에 내키지 않다는 듯 이렇게 말하였다.
“땅이 천 리도 채 못 되니 여기서 무엇을 한단 말인가. 그렇지만 땅이 기름지고 물이 좋으니 아쉬운 대로 부잣집 늙은이 노릇은 할 수 있겠구나.”

뱃사공이 고개를 갸웃거리며 물었다.
“덕이 있으면 사람이야 저절로 모이게 마련이지. 덕 없는 것이 두렵지 사람 없는 것이야 걱정할 게 있나.”

허생은 변산으로 가서 도둑 떼의 산채를 찾았다. 그리고 그 우두머리를 만나 이렇게 물었다.
“너희들 천 명이 천 냥을 노략질해서 나누어 가진다면 한 사람 앞에 얼마씩 돌아가겠느냐?”
도둑의 우두머리는 누구를 바보로 아느냐는 듯 눈을 부라렸다.
“그거야 한 사람 앞에 한 냥씩이지, 얼마야.”
“그럼 너희들에게 아내가 있느냐?”
“없어!”
“그럼 논밭은?”
“흥, 논밭 있고 마누라 있으면 도둑질은 왜 해!”
“정말 그렇다면, 왜 아내 얻고 집 짓고 소 사서 농사지을 궁리를 안 하느냐? 그러면 도둑놈이라는 더러운 말도 안 들을 테고, 아내와 자식 낳고 사는 재미가 절로 나고, 자기 마음대로 나돌아 다녀도 누구한테 잡혀갈 걱정도 없을 테니 얼마나 좋으냐? 그렇게 잘 먹고 잘살 수 있는 길을 두고 왜 이렇게 지낸단 말이냐?”
“허허, 누구 약 올리는 거냐, 지금! 누가 그걸 몰라서 이러고 있나. 돈이 없으니까 그렇지.”
허생은 그제야 껄껄껄 웃으며 말하였다.
“명색이 도둑질을 한다면서 돈이 없다는 게 말이 되나? 정 그렇다면 내가 마련해 주지. 내일 바닷가에 나오면 붉은 깃발을 단 배들이 보일 게야. 모두 돈을 가득 실은 배지. 와서 자네들이 갖고 싶은 만큼 마음대로 가져가게.”
허생은 이렇게 말한 뒤에 총총히 가 버렸다. 도둑들은 모두 허생을 미친놈이라고 비웃었다.    
그러나 다음 날, 도둑들은 혹시나 하는 마음에 바닷가로 나가 보았다. 그런데 이게 웬일인가! 과연 붉은 깃발을 높이 올린 배가 여러 척 떠 있고, 배 위에서는 허생이 돈 삼십만 냥을 싣고 기다리고 있는 것이 아닌가.
도둑들은 놀라 뒤로 자빠질 지경이었다. 도둑들은 허생이 보통 사람이 아니라 생각하고 모두 넙죽넙죽 바닥에 엎드려 절을 하였다.
“그저 장군님의 분부대로 따르겠습니다.”

허생의 말이 떨어지기 무섭게 도둑들은 돈 자루로 달려들었다. 그러나 마음뿐이지 기운깨나 쓴다는 놈들도 백 냥을 다 짊어지지 못하였다.
“백 냥도 채 짊어지지 못하는 놈들이 무슨 도둑질을 한단 말이냐? 그렇다고 이제 와서 평민으로 돌아가려 해도 너희들 이름이 이미 도둑 명부에 올라 있으니 어쩔 도리가 없구나. 오히려 잘되었다. 내 여기서 기다릴 테니, 한 사람 앞에 백 냥씩 가지고 가서 결혼할 여자와 소 한 마리씩을 구해 오너라.”
허생의 말이 채 끝나기도 전에 도둑들은 “예이—.” 하고는 저마다 돈 자루를 짊어지고 “얼쑤, 좋다.” 하며 뿔뿔이 흩어졌다. 허생은 이천 명이 일 년 동안 먹을 양식을 마련해 가지고 도둑들을 기다렸다.
약속한 날짜에 맞추어 도둑들은 저마다 여자는 걷게 하고 소는 몰고, 또는 여자를 소 등에 태우고 돌아왔다. 허생은 이들을 모두 배에 태우고 빈 섬으로 갔다. 허생이 떼도둑을 한꺼번에 몽땅 쓸어 가 버리니 나라 안은 하루아침에 씻은 듯이 조용해졌다.
허생과 함께 섬에 들어간 사람들은 저마다 나무를 베어 집을 짓고 대를 엮어 울타리를 세웠다. 빈 섬에 금세 큰 마을이 생겨난 것이다. 기름진 땅에 논밭을 일구고 씨를 뿌리니 온갖 곡식이 잘 자라서 김을 매지 않아도 한 줄기에 열매가 아홉 이삭씩 달렸다.
곡식을 거두어서는 삼 년 동안 먹을 양식을 저장하고 나머지는 모두 배에 싣고 장기도로 가서 팔았다. 장기도는 일본의 영토인데, 때마침 흉년이 든 참이라 가지고 간 양식을 모두 팔고 은 백만 냥을 벌어 가지고 돌아왔다.
“이제야 뭘 좀 해 본 것 같구나.”
허생은 가슴을 내밀어 숨을 크게 내쉬고는 섬에 사는 남녀 이천 명을 모두 한자리에 모이게 하였다.
“내가 처음 너희들과 함께 이 섬에 들어올 때에는 먼저 부자가 되게 한 다음, 문자도 새로 만들고 의관도 새로이 정하려 하였다. 그러나 땅은 좁고 내 덕 또한 부족하니 나는 이제 여기를 떠나련다. 너희들은 아이를 낳거든 오른손으로 숟가락을 잡도록 가르치고, 또 하루라도 먼저 태어난 사람이 먼저 음식을 먹도록 양보하게 하여라.”
그러고는 자기가 타고 갈 배 한 척만 남겨 두고 나머지 배는 모두 불살라 버렸다.
“가지 않으면 오는 사람도 없겠지.”
그리고 은 백만 냥 중 오십만 냥도 바닷속에 던져 버렸다.
“바다가 마르면 주워 갈 사람이 있겠지. 백만 냥이면 조선 땅 안에서도 다 써먹을 수 없는데, 하물며 이 조그만 섬에서 어디에 쓰랴.”
마지막으로 글을 아는 사람들을 골라 모조리 배에 태우고 함께 조선으로 돌아왔다.
“글이란 모름지기 재앙의 근원이야. 이 섬에서 재앙의 뿌리를 없애 버려야지.”
허생은 조선에 돌아오자마자 남은 오십만 냥을 가지고 나라 안을 두루 돌아다니며 가난하고 의지할 곳 없는 사람들을 도와주었다. 그러고도 십만 냥이나 남았다.
“이 돈으로 변 부자한테 빌린 돈을 갚아야겠다.”
허생은 참으로 오랜만에 변 부자를 찾아갔다.

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (currentMode === 'vocabQuiz') {
                if (vocabTimeLeft <= 0) {
                    clearInterval(timerInterval);
                    isVocabActive = false;
                    renderVocabQuiz();
                } else {
                    vocabTimeLeft--;
                    updateTimerUI('vocabTimerText', vocabTimeLeft);
                }
            } else if (currentMode === 'qaQuiz') {
                if (qaTimeLeft <= 0) {
                    clearInterval(timerInterval);
                    isQaActive = false;
                    renderQaQuiz();
                } else {
                    qaTimeLeft--;
                    updateTimerUI('qaTimerText', qaTimeLeft);
                }
            }
        }, 1000);
    }

    function updateTimerUI(id, time) {
        const el = document.getElementById(id);
        if (el) {
            const min = String(Math.floor(time / 60)).padStart(2, '0');
            const sec = String(time % 60).padStart(2, '0');
            el.innerText = `${min}:${sec}`;
        }
    }

    window.resetVocabQuiz = function() {
        vocabScore = 0;
        vocabTotal = 0;
        vocabTimeLeft = 300;
        isVocabActive = true;
        startTimer();
        renderVocabQuiz();
    };

    window.resetQaQuiz = function() {
        if (qaQuizLevel === '초급') qaTimeLeft = 180;
        else if (qaQuizLevel === '중급') qaTimeLeft = 240;
        else qaTimeLeft = 300;
        
        isQaActive = true;
        startTimer();
        renderQaQuiz();
    };

    window.changeQaLevel = function(level) {
        qaQuizLevel = level;
        resetQaQuiz(); 
    };

    function renderText() {
        const words = Object.keys(dictionary).sort((a, b) => b.length - a.length);
        let htmlText = rawText.replace(/\n/g, '<br>');
        
        words.forEach(word => {
            const regex = new RegExp(`(${word})`, 'g');
            htmlText = htmlText.replace(regex, (match) => {
                if (highlightFixes[word]) return highlightFixes[word];
                return `<span class="vocab-hl" data-word="${word}">${word}</span>`;
            });
        });
        textPanel.innerHTML = htmlText;
    }

    function renderPanel(filter = '') {
        panelContent.innerHTML = '';
        const query = filter.toLowerCase().trim();
        let hasResult = false;

        if (currentMode === 'dict') {
            for (const [word, desc] of Object.entries(dictionary)) {
                const displayWord = displayNames[word] || word;
                if (displayWord.toLowerCase().includes(query) || desc.toLowerCase().includes(query)) {
                    // ✨ 사전 단어 클릭 시 scrollToWord() 실행
                    panelContent.innerHTML += `
                        <div class="dict-item">
                            <div class="dict-word clickable" title="클릭하여 본문 위치 찾기" onclick="scrollToWord('${word}')">🔍 ${displayWord}</div>
                            <div>${desc}</div>
                        </div>`;
                    hasResult = true;
                }
            }
            if (!hasResult) panelContent.innerHTML = '<div>검색 결과가 없습니다.</div>';
            
        } else if (currentMode === 'qa') {
            worksheetDataClean.forEach(item => {
                if (item.q.toLowerCase().includes(query) || item.a.toLowerCase().includes(query)) {
                    panelContent.innerHTML += `
                        <div class="dict-item">
                            <div class="qa-q">Q. ${item.q}</div>
                            <div class="qa-a">${item.a}</div>
                        </div>`;
                    hasResult = true;
                }
            });
            if (!hasResult) panelContent.innerHTML = '<div>검색 결과가 없습니다.</div>';
            
        } else if (currentMode === 'vocabQuiz') {
            if (query !== '') {
                panelContent.innerHTML = '<div style="text-align:center; padding: 20px; color:#64748b;">퀴즈 모드에서는 검색 기능이 제한됩니다. <br>단어를 검색하려면 상단의 <b>[📖 어휘]</b> 탭을 눌러주세요.</div>';
                return;
            }
            renderVocabQuiz();
        } else if (currentMode === 'qaQuiz') {
            if (query !== '') {
                panelContent.innerHTML = '<div style="text-align:center; padding: 20px; color:#64748b;">퀴즈 모드에서는 검색 기능이 제한됩니다. <br>요점을 검색하려면 상단의 <b>[📝 요점]</b> 탭을 눌러주세요.</div>';
                return;
            }
            renderQaQuiz();
        }
    }

    // ==========================================
    // 1. 어휘 퀴즈 렌더링
    // ==========================================
    function renderVocabQuiz() {
        if (vocabTimeLeft <= 0) {
            panelContent.innerHTML = `
                <div class="quiz-container" style="text-align:center; justify-content:center; align-items:center;">
                    <div style="font-size: 4rem; margin-bottom: 10px;">⏰</div>
                    <h2 style="color: #dc2626; margin: 0;">제한 시간 종료!</h2>
                    <div style="font-size:1.5rem; margin:20px 0;">최종 점수: <span style="color:var(--primary); font-weight:bold;">${vocabScore}</span> / ${vocabTotal}</div>
                    <button class="quiz-btn" style="width: 200px; margin: 0 auto;" onclick="resetVocabQuiz()">다시 시작하기</button>
                </div>
            `;
            return;
        }

        const words = Object.keys(dictionary);
        const correctWord = words[Math.floor(Math.random() * words.length)];
        const correctDesc = dictionary[correctWord];
        
        let options = [correctWord];
        while(options.length < 4) {
            let randomWord = words[Math.floor(Math.random() * words.length)];
            if (!options.includes(randomWord)) {
                options.push(randomWord);
            }
        }
        
        options.sort(() => Math.random() - 0.5);
        
        // ✨ 이번 퀴즈의 보기 항목들을 전역 변수에 저장 (오답 풀이용)
        currentVocabOptions = options;

        const min = String(Math.floor(vocabTimeLeft / 60)).padStart(2, '0');
        const sec = String(vocabTimeLeft % 60).padStart(2, '0');

        let html = `
            <div class="quiz-container">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px dashed var(--border); padding-bottom: 15px;">
                    <div class="quiz-timer">⏳ 남은 시간: <span id="vocabTimerText" style="color:#dc2626;">${min}:${sec}</span></div>
                    <div>
                        <span class="quiz-score">맞힌 개수: <span style="color:var(--primary)">${vocabScore}</span> / ${vocabTotal}</span>
                        <button class="quiz-reset-btn" onclick="resetVocabQuiz()">초기화</button>
                    </div>
                </div>
                <div class="quiz-question">
                    🤔 <b>다음 뜻을 가진 단어는 무엇일까요?</b><br><br>
                    "${correctDesc}"
                </div>
                <div class="quiz-options">
        `;
        
        options.forEach(opt => {
            const displayOpt = displayNames[opt] || opt;
            html += `<button class="quiz-btn" onclick="submitVocabAnswer('${opt}', '${correctWord}')">${displayOpt}</button>`;
        });
        
        html += `
                </div>
                <div class="quiz-feedback" id="quizFeedback"></div>
            </div>
        `;
        
        panelContent.innerHTML = html;
    }

    // ✨ 보기 뜻 풀이 제공 및 수동 다음 문제 넘기기 적용
    window.submitVocabAnswer = function(selected, correct) {
        if (vocabTimeLeft <= 0) return;
        
        const feedback = document.getElementById('quizFeedback');
        const buttons = document.querySelectorAll('.quiz-btn');
        vocabTotal++;
        
        buttons.forEach(btn => btn.disabled = true);

        let feedbackHtml = '';

        if (selected === correct) {
            vocabScore++;
            feedbackHtml += '<div style="color:#16a34a; font-size: 1.4rem; margin-bottom: 15px;">정답입니다! 🎉</div>';
        } else {
            const correctDisplay = displayNames[correct] || correct;
            feedbackHtml += `<div style="color:#dc2626; font-size: 1.4rem; margin-bottom: 15px;">틀렸습니다. 정답은 <b>'${correctDisplay}'</b>입니다. 😢</div>`;
        }

        // 보기로 나왔던 4개 단어의 뜻 목록 생성
        feedbackHtml += `
            <div style="text-align: left; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px;">
                <div style="font-weight: bold; margin-bottom: 8px; color: #0f172a;">💡 보기 단어 뜻 확인</div>
                <ul style="margin: 0; padding-left: 20px; font-size: 1rem; color: #334155; line-height: 1.6;">
        `;
        
        currentVocabOptions.forEach(opt => {
            const displayOpt = displayNames[opt] || opt;
            const desc = dictionary[opt];
            feedbackHtml += `<li><b>${displayOpt}</b>: ${desc}</li>`;
        });
        
        feedbackHtml += `</ul></div>`;
        
        // 다음 문제 버튼 추가
        feedbackHtml += `<button class="quiz-btn" style="width: 100%; background: #e0e7ff; color: #1e40af; border: none;" onclick="if(vocabTimeLeft > 0) renderVocabQuiz()">다음 문제 ➡️</button>`;

        feedback.innerHTML = feedbackHtml;
        document.querySelector('.quiz-score').innerHTML = `맞힌 개수: <span style="color:var(--primary)">${vocabScore}</span> / ${vocabTotal}`;
    };

    // ==========================================
    // 2. 요점 퀴즈 (빈칸 채우기) 렌더링
    // ==========================================
    function renderQaQuiz() {
        if (qaTimeLeft <= 0) {
            panelContent.innerHTML = `
                <div class="quiz-container" style="text-align:center; justify-content:center; align-items:center;">
                    <div style="font-size: 4rem; margin-bottom: 10px;">⏰</div>
                    <h2 style="color: #dc2626; margin: 0;">제한 시간 종료!</h2>
                    <button class="quiz-btn" style="width: 200px; margin: 20px auto 0;" onclick="resetQaQuiz()">다시 시작하기</button>
                </div>
            `;
            return;
        }

        const min = String(Math.floor(qaTimeLeft / 60)).padStart(2, '0');
        const sec = String(qaTimeLeft % 60).padStart(2, '0');

        let html = `
            <div class="quiz-container">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px dashed var(--border); padding-bottom: 15px;">
                    <div class="quiz-timer">⏳ 남은 시간: <span id="qaTimerText" style="color:#dc2626;">${min}:${sec}</span></div>
                    <div>
                        <select id="qaLevelSelect" onchange="changeQaLevel(this.value)" style="padding: 6px; border-radius: 4px; border: 1px solid var(--border); font-size: 1rem; font-weight:bold; color:var(--text); margin-right: 10px;">
                            <option value="초급" ${qaQuizLevel === '초급' ? 'selected' : ''}>🌱 초급 (3분)</option>
                            <option value="중급" ${qaQuizLevel === '중급' ? 'selected' : ''}>🌿 중급 (4분)</option>
                            <option value="상급" ${qaQuizLevel === '상급' ? 'selected' : ''}>🌳 상급 (5분)</option>
                        </select>
                        <button class="quiz-reset-btn" onclick="resetQaQuiz()">초기화</button>
                    </div>
                </div>
                <div style="max-height: 60vh; overflow-y: auto; padding-right:10px;">
        `;

        worksheetDataRaw.forEach((item, index) => {
            let processedA = createBlanks(item.a, qaQuizLevel);
            html += `
                <div class="dict-item" style="background:#f8fafc; padding: 15px; border-radius:8px;">
                    <div class="qa-q">Q. ${item.q}</div>
                    <div class="qa-a" style="line-height:2.4; padding-left:0;">A. ${processedA}</div>
                </div>
            `;
        });

        html += `
                </div>
                <button class="quiz-btn" style="width: 100%; margin-top:10px;" onclick="checkQaAnswers()">✅ 전체 정답 확인</button>
                <div id="qaQuizFeedback" class="quiz-feedback"></div>
            </div>
        `;

        panelContent.innerHTML = html;
    }

    function createBlanks(text, level) {
        const matches = [...text.matchAll(/\[(.*?)\]/g)];
        if (matches.length === 0) return text;

        const total = matches.length;
        let blankCount = 0;
        
        if (level === '초급') blankCount = Math.max(1, Math.floor(total * 0.35));
        else if (level === '중급') blankCount = Math.max(1, Math.floor(total * 0.7));
        else blankCount = total;

        let indicesToBlank = matches.map((_, i) => i);
        indicesToBlank.sort(() => Math.random() - 0.5);
        indicesToBlank = indicesToBlank.slice(0, blankCount);

        let result = text;
        matches.forEach((match, i) => {
            if (indicesToBlank.includes(i)) {
                const inputHtml = `<input type="text" class="qa-input" data-answer="${match[1]}" autocomplete="off" spellcheck="false" style="width:${match[1].length * 1.5 + 1}em;">`;
                result = result.replace(match[0], inputHtml);
            } else {
                result = result.replace(match[0], `<span class="qa-highlight">${match[1]}</span>`);
            }
        });
        return result;
    }

    window.checkQaAnswers = function() {
        if (qaTimeLeft <= 0) return;
        isQaActive = false; 
        clearInterval(timerInterval);

        const inputs = document.querySelectorAll('.qa-input');
        let correctCount = 0;
        
        inputs.forEach(input => {
            const correctAnswer = input.getAttribute('data-answer');
            const userAnswer = input.value.trim();
            
            const isCorrect = userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
            
            if (isCorrect) {
                correctCount++;
                input.style.backgroundColor = '#dcfce7';
                input.style.borderBottomColor = '#16a34a';
                input.style.color = '#16a34a';
                input.disabled = true;
            } else {
                input.style.backgroundColor = '#fee2e2';
                input.style.borderBottomColor = '#dc2626';
                input.style.color = '#dc2626';
                
                if (!input.nextElementSibling || !input.nextElementSibling.classList.contains('qa-correction')) {
                    const corrSpan = document.createElement('span');
                    corrSpan.className = 'qa-correction';
                    corrSpan.innerText = `(정답: ${correctAnswer})`;
                    input.parentNode.insertBefore(corrSpan, input.nextSibling);
                }
                input.disabled = true;
            }
        });

        const feedback = document.getElementById('qaQuizFeedback');
        feedback.innerHTML = `총 <span style="color:var(--primary);">${inputs.length}</span>개의 빈칸 중 <span style="color:#16a34a;">${correctCount}</span>개를 맞혔습니다! (다시 풀려면 '초기화' 버튼 클릭)`;
    }

    // ==========================================
    // 공통 이벤트 설정
    // ==========================================
    function setupEvents() {
        textPanel.addEventListener('click', (e) => {
            if (e.target.classList.contains('vocab-hl')) {
                if (currentMode !== 'dict') {
                    currentMode = 'dict';
                    tabBtns.forEach(b => b.classList.remove('active'));
                    document.querySelector('[data-tab="dict"]').classList.add('active');
                    
                    isVocabActive = false;
                    isQaActive = false;
                    clearInterval(timerInterval);
                }

                document.querySelectorAll('.vocab-hl').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active');
                
                const word = e.target.getAttribute('data-word');
                if (dictionary[word]) {
                    const displayWord = displayNames[word] || word;
                    panelContent.innerHTML = `
                        <div class="dict-item">
                            <div class="dict-word clickable" title="클릭하여 본문 위치 찾기" onclick="scrollToWord('${word}')">🔍 ${displayWord}</div>
                            <div>${dictionary[word]}</div>
                        </div>`;
                }
            }
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                tabBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentMode = e.target.getAttribute('data-tab');
                
                isVocabActive = false;
                isQaActive = false;
                clearInterval(timerInterval);

                if (currentMode === 'vocabQuiz') {
                    if (vocabTimeLeft > 0) { isVocabActive = true; startTimer(); }
                } else if (currentMode === 'qaQuiz') {
                    if (qaTimeLeft > 0) { isQaActive = true; startTimer(); }
                }
                
                searchInput.value = '';
                document.querySelectorAll('.vocab-hl').forEach(el => el.classList.remove('active'));
                renderPanel();
            });
        });

        searchInput.addEventListener('input', (e) => {
            if ((currentMode === 'vocabQuiz' || currentMode === 'qaQuiz') && e.target.value.trim() !== '') {
                currentMode = currentMode === 'vocabQuiz' ? 'dict' : 'qa';
                tabBtns.forEach(b => b.classList.remove('active'));
                document.querySelector(`[data-tab="${currentMode}"]`).classList.add('active');
                
                isVocabActive = false;
                isQaActive = false;
                clearInterval(timerInterval);
            }
            renderPanel(e.target.value);
            document.querySelectorAll('.vocab-hl').forEach(el => el.classList.remove('active'));
        });

        showAllBtn.addEventListener('click', () => {
            searchInput.value = '';
            renderPanel();
            document.querySelectorAll('.vocab-hl').forEach(el => el.classList.remove('active'));
        });
    }

    init();
</script>
</body>
</html>
